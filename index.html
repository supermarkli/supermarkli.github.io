<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Moved · Zihao Li</title>

    <meta name="description"
          content="Zihao Li's personal website has moved to a new address.">

    <style>
        :root {
            --blue: #0969da;
            --blue-hover: #075bb5;
            --text: #24292f;
            --secondary: #57606a;
            --muted: #8c959f;
            --background: #f6f8fa;
            --border: #d8dee4;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);
        }

        .card {
            width: min(960px, 100%);

            padding: 72px 60px;

            background: #ffffff;

            border: 1px solid var(--border);
            border-radius: 16px;

            text-align: center;

            box-shadow:
                0 8px 30px rgba(27, 31, 36, 0.08);
        }

        .icon {
            width: 92px;
            height: 92px;

            margin: 0 auto 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--blue);
            color: #ffffff;

            font-size: 46px;
            font-weight: 400;

            box-shadow:
                0 6px 18px rgba(9, 105, 218, 0.22);
        }

        h1 {
            margin: 0 0 20px;

            font-size: clamp(32px, 4vw, 48px);
            line-height: 1.2;
            font-weight: 650;
            letter-spacing: -0.025em;
        }

        .description {
            max-width: 620px;

            margin: 0 auto 36px;

            color: var(--secondary);

            font-size: 18px;
            line-height: 1.7;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 230px;

            padding: 13px 24px;

            border-radius: 8px;

            background: var(--blue);
            color: #ffffff;

            font-size: 16px;
            font-weight: 600;

            text-decoration: none;

            box-shadow:
                0 2px 5px rgba(9, 105, 218, 0.2);

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            background: var(--blue-hover);

            transform: translateY(-1px);

            box-shadow:
                0 5px 12px rgba(9, 105, 218, 0.25);
        }

        .button:active {
            transform: translateY(0);
        }

        .url {
            margin-top: 20px;

            color: var(--muted);

            font-size: 14px;
        }

        .url a {
            color: inherit;
            text-decoration: none;
        }

        .url a:hover {
            color: var(--blue);
            text-decoration: underline;
        }

        .footer {
            margin-top: 42px;
            padding-top: 24px;

            border-top: 1px solid #eaeef2;

            color: var(--muted);

            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 52px 24px;
                border-radius: 12px;
            }

            .icon {
                width: 76px;
                height: 76px;

                margin-bottom: 28px;

                font-size: 38px;
            }

            h1 {
                font-size: 30px;
            }

            .description {
                font-size: 16px;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="icon" aria-hidden="true">↗</div>

        <h1>This website has moved.</h1>

        <p class="description">
            My personal website has moved to a new address.
            <br>
            Please visit my new website below.
        </p>

        <a
            class="button"
            href="https://iamzihao.github.io/"
        >
            Visit my new website
        </a>

        <div class="url">
            <a href="https://iamzihao.github.io/">
                iamzihao.github.io
            </a>
        </div>

        <div class="footer">
            Zihao Li · Personal Website
        </div>

    </main>

</body>
</html>
