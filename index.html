<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Moved · Zihao Li</title>

    <meta name="description"
          content="Zihao Li's personal academic website has moved to a new address.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            background: #f6f8fa;
            color: #24292f;
        }

        .container {
            width: min(680px, calc(100% - 40px));
            padding: 48px 40px;

            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #0969da;
            color: white;

            font-size: 28px;
            font-weight: 600;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 28px;
            font-weight: 600;
        }

        p {
            margin: 0 0 28px;
            color: #57606a;
            font-size: 16px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;

            background: #0969da;
            color: white;

            border-radius: 6px;

            font-size: 15px;
            font-weight: 500;
            text-decoration: none;

            transition: background 0.2s ease;
        }

        .button:hover {
            background: #0550ae;
        }

        .url {
            margin-top: 20px;

            font-size: 13px;
            color: #8c959f;

            word-break: break-all;
        }

        .url a {
            color: inherit;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 36px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">↗</div>

        <h1>This website has moved.</h1>

        <p>
            My personal website has moved to a new address.
            <br>
            Please visit my new website below.
        </p>

        <a
            class="button"
            href="https://iamzihao.github.io/"
        >
            Visit my new website
        </a>

        <div class="url">
            <a href="https://iamzihao.github.io/">
                iamzihao.github.io
            </a>
        </div>

    </main>

</body>
</html>
